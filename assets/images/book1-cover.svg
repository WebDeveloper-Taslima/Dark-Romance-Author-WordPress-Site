<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190d14"/>
      <stop offset="50%" stop-color="#0e070c"/>
      <stop offset="100%" stop-color="#050305"/>
    </linearGradient>

    <radialGradient id="roseGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#7a142c" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#3d0714" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="coverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1cd"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#f5e1a4"/>
      <stop offset="100%" stop-color="#997228"/>
    </linearGradient>

    <filter id="crimsonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#55081a" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgGrad1)"/>
  <rect width="400" height="600" fill="url(#roseGlow)"/>

  <!-- Ornate Border Frame -->
  <rect x="18" y="18" width="364" height="564" rx="4" fill="none" stroke="url(#coverGold)" stroke-width="1.2" opacity="0.6"/>
  <rect x="24" y="24" width="352" height="552" rx="2" fill="none" stroke="url(#coverGold)" stroke-width="0.6" opacity="0.4"/>
  <!-- Corner Ornaments -->
  <path d="M 24,45 L 45,45 L 45,24" fill="none" stroke="url(#coverGold)" stroke-width="1.5"/>
  <path d="M 376,45 L 355,45 L 355,24" fill="none" stroke="url(#coverGold)" stroke-width="1.5"/>
  <path d="M 24,555 L 45,555 L 45,576" fill="none" stroke="url(#coverGold)" stroke-width="1.5"/>
  <path d="M 376,555 L 355,555 L 355,576" fill="none" stroke="url(#coverGold)" stroke-width="1.5"/>

  <!-- Series Badge Top -->
  <text x="200" y="65" font-family="'Cinzel', 'Georgia', serif" font-size="11" letter-spacing="4" fill="url(#coverGold)" text-anchor="middle" opacity="0.9">A SINNERS &amp; KINGS NOVEL • BOOK I</text>
  <line x1="120" y1="75" x2="280" y2="75" stroke="url(#coverGold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Central Dark Romance Artwork (Gothic Bloody Rose & Dagger/Wings) -->
  <g transform="translate(200, 260)" filter="url(#crimsonShadow)">
    <!-- Aura & Smoke rings -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#7a142c" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#coverGold)" stroke-width="0.5" stroke-dasharray="3,6" opacity="0.4"/>

    <!-- Wing Silhouettes in Background -->
    <path d="M 0,20 C 50,-60 110,-70 130,-10 C 120,40 70,80 0,90 C -70,80 -120,40 -130,-10 C -110,-70 -50,-60 0,20 Z" 
          fill="#1c0712" stroke="url(#coverGold)" stroke-width="1" opacity="0.5"/>

    <!-- Crimson Rose Graphic -->
    <path d="M 0,-40 C 30,-70 70,-30 45,15 C 20,50 -20,50 -45,15 C -70,-30 -30,-70 0,-40 Z" fill="#690e21"/>
    <path d="M 0,-30 C 20,-50 45,-20 30,10 C 15,30 -15,30 -30,10 C -45,-20 -20,-50 0,-30 Z" fill="#8c122c"/>
    <path d="M 0,-20 C 12,-35 28,-15 18,5 C 8,20 -8,20 -18,5 C -28,-15 -12,-35 0,-20 Z" fill="#b31938"/>
    <path d="M 0,-10 C 8,-20 18,-8 10,0 C 0,8 -10,0 -2,-10 Z" fill="#d92347"/>

    <!-- Rose Petal Highlights in Gold -->
    <path d="M -30,0 C -20,25 0,35 15,30" fill="none" stroke="url(#coverGold)" stroke-width="1.2" opacity="0.8"/>
    <path d="M 25,-10 C 35,10 20,30 5,35" fill="none" stroke="url(#coverGold)" stroke-width="1.2" opacity="0.8"/>

    <!-- Thorns & Dagger Piercing Rose -->
    <path d="M 0,-120 L 6,-40 L 0,-20 L -6,-40 Z" fill="url(#coverGold)"/>
    <path d="M 0,40 L 5,110 L 0,135 L -5,110 Z" fill="url(#coverGold)"/>
    <circle cx="0" cy="-120" r="5" fill="url(#coverGold)"/>

    <!-- Dripping Blood / Petals -->
    <path d="M 0,135 C 2,145 0,152 0,155 C 0,152 -2,145 0,135 Z" fill="#b31938"/>
  </g>

  <!-- Title Section -->
  <text x="200" y="420" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="19" letter-spacing="8" fill="#d0cbd3" text-anchor="middle">THE</text>
  <text x="200" y="465" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="42" font-weight="700" letter-spacing="4" fill="url(#coverGold)" text-anchor="middle">DEVIL'S</text>
  <text x="200" y="505" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="36" font-weight="600" letter-spacing="6" fill="#fdf0cd" text-anchor="middle">ROSE</text>

  <!-- Author Name Bottom -->
  <line x1="80" y1="525" x2="320" y2="525" stroke="url(#coverGold)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="555" font-family="'Cinzel', 'Georgia', serif" font-size="18" font-weight="600" letter-spacing="8" fill="url(#coverGold)" text-anchor="middle">CHRISTIANA CIOCAN</text>
</svg>
