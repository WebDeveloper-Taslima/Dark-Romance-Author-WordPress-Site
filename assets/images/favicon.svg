  </defs>
  <rect width="128" height="128" rx="28" fill="#0d0d0f"/>
  <rect width="120" height="120" x="4" y="4" rx="24" fill="none" stroke="url(#favGold)" stroke-width="1.5" opacity="0.6"/>
  <g transform="translate(64, 64) scale(0.32)">
    <!-- Central Nib -->
