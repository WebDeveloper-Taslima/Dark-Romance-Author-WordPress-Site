    <circle cx="0" cy="-80" r="7" fill="none" stroke="url(#favGold)" stroke-width="5"/>
    <line x1="0" y1="-145" x2="0" y2="-87" stroke="url(#favGold)" stroke-width="5"/>
    <line x1="0" y1="-73" x2="0" y2="-35" stroke="url(#favGold)" stroke-width="5"/>
