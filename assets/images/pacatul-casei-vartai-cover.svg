<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldTextVartai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1d0"/>
      <stop offset="40%" stop-color="#e5b842"/>
      <stop offset="70%" stop-color="#cb9726"/>
      <stop offset="100%" stop-color="#f5dc8e"/>
    </linearGradient>

    <linearGradient id="goldFrameVartai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeac3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a671a"/>
    </linearGradient>

    <radialGradient id="vignetteDark" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="85%" stop-color="#080709" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050406" stop-opacity="0.98"/>
    </radialGradient>
  </defs>

  <!-- Embedded Generated Artwork -->
  <image href="pacatul-casei-vartai-hero.jpg" x="-100" y="0" width="600" height="600" preserveAspectRatio="xMidYMid slice"/>

  <!-- Vignette & Dark Tint -->
  <rect width="400" height="600" fill="url(#vignetteDark)"/>
  <rect width="400" height="150" y="0" fill="linear-gradient(to bottom, rgba(5,4,6,0.95), transparent)"/>
  <rect width="400" height="230" y="370" fill="linear-gradient(to top, rgba(5,4,6,0.98) 40%, rgba(5,4,6,0.85) 75%, transparent 100%)"/>

  <!-- Ornate Border Frame -->
  <rect x="16" y="16" width="368" height="568" rx="3" fill="none" stroke="url(#goldFrameVartai)" stroke-width="1.2" opacity="0.6"/>
  <rect x="22" y="22" width="356" height="556" rx="2" fill="none" stroke="url(#goldFrameVartai)" stroke-width="0.5" opacity="0.4"/>
  <!-- Corner Ornaments -->
  <path d="M 22,40 L 40,40 L 40,22" fill="none" stroke="url(#goldFrameVartai)" stroke-width="1.5"/>
  <path d="M 378,40 L 360,40 L 360,22" fill="none" stroke="url(#goldFrameVartai)" stroke-width="1.5"/>
  <path d="M 22,560 L 40,560 L 40,578" fill="none" stroke="url(#goldFrameVartai)" stroke-width="1.5"/>
  <path d="M 378,560 L 360,560 L 360,578" fill="none" stroke="url(#goldFrameVartai)" stroke-width="1.5"/>

  <!-- Top Series Tag -->
  <text x="200" y="55" font-family="'Cinzel', 'Georgia', serif" font-size="10" letter-spacing="4" fill="url(#goldTextVartai)" text-anchor="middle">SERIA IMPERIUL UMBRELOR • VOLUMUL 1</text>
  <line x1="110" y1="65" x2="290" y2="65" stroke="url(#goldFrameVartai)" stroke-width="0.8" opacity="0.5"/>

  <!-- Title Bottom -->
  <text x="200" y="445" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="21" font-weight="700" letter-spacing="3" fill="#ffffff" text-anchor="middle">PĂCATUL</text>
  <text x="200" y="482" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#goldTextVartai)" text-anchor="middle">CASEI VARTAI</text>

  <!-- Author Name -->
  <line x1="80" y1="515" x2="320" y2="515" stroke="url(#goldFrameVartai)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="545" font-family="'Cinzel', 'Georgia', serif" font-size="16" font-weight="700" letter-spacing="8" fill="url(#goldTextVartai)" text-anchor="middle">CHRISTIANA CIOCAN</text>
</svg>
