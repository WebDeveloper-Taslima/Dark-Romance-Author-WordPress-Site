<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121a"/>
      <stop offset="50%" stop-color="#05080d"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#14344d" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#081826" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="silverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#9ea4b0"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <filter id="chainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#bgGrad2)"/>
  <rect width="400" height="600" fill="url(#blueGlow)"/>

  <!-- Ornate Frame -->
  <rect x="18" y="18" width="364" height="564" rx="4" fill="none" stroke="url(#silverGold)" stroke-width="1.2" opacity="0.6"/>
  <rect x="24" y="24" width="352" height="552" rx="2" fill="none" stroke="url(#silverGold)" stroke-width="0.6" opacity="0.4"/>

  <!-- Series Badge Top -->
  <text x="200" y="65" font-family="'Cinzel', 'Georgia', serif" font-size="11" letter-spacing="4" fill="url(#silverGold)" text-anchor="middle" opacity="0.9">A SINNERS &amp; KINGS NOVEL • BOOK II</text>
  <line x1="120" y1="75" x2="280" y2="75" stroke="url(#silverGold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Artwork: Obsidian Crystal & Broken Chains -->
  <g transform="translate(200, 260)" filter="url(#chainShadow)">
    <circle cx="0" cy="0" r="105" fill="none" stroke="#1d405e" stroke-width="1" opacity="0.4"/>
    
    <!-- Obsidian Shard -->
    <polygon points="0,-110 45,-20 30,90 0,135 -30,90 -45,-20" fill="#0d1b24" stroke="url(#silverGold)" stroke-width="1.8"/>
    <polygon points="0,-110 0,135 30,90 45,-20" fill="#162c3b" stroke="url(#silverGold)" stroke-width="1" opacity="0.7"/>
    <polygon points="0,-110 -25,-15 0,135" fill="#203d52" opacity="0.4"/>

    <!-- Gothic Chains wrapping shard -->
    <path d="M -80,-50 C -40,-20 40,-80 80,-40" fill="none" stroke="url(#silverGold)" stroke-width="4" stroke-dasharray="8,6"/>
    <path d="M -90,20 C -20,60 50,0 90,40" fill="none" stroke="url(#silverGold)" stroke-width="4" stroke-dasharray="8,6"/>
    <path d="M -70,80 C -30,120 40,70 80,100" fill="none" stroke="url(#silverGold)" stroke-width="4" stroke-dasharray="8,6"/>

    <!-- Crescent Moon behind -->
    <path d="M -40,-90 C 30,-120 100,-70 90,30 C 80,-30 30,-70 -40,-90 Z" fill="url(#silverGold)" opacity="0.3"/>
  </g>

  <!-- Title Section -->
  <text x="200" y="420" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#silverGold)" text-anchor="middle">BOUND BY</text>
  <text x="200" y="465" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="700" letter-spacing="6" fill="#e8f1f5" text-anchor="middle">OBSIDIAN</text>

  <!-- Author Name Bottom -->
  <line x1="80" y1="525" x2="320" y2="525" stroke="url(#silverGold)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="555" font-family="'Cinzel', 'Georgia', serif" font-size="18" font-weight="600" letter-spacing="8" fill="url(#silverGold)" text-anchor="middle">CHRISTIANA CIOCAN</text>
</svg>
