<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSinistra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e060e"/>
      <stop offset="50%" stop-color="#100307"/>
      <stop offset="100%" stop-color="#050103"/>
    </linearGradient>

    <radialGradient id="maskGlowSinistra" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#7a1027" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#360611" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldSinistra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1cd"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#f5e1a4"/>
      <stop offset="100%" stop-color="#997228"/>
    </linearGradient>

    <filter id="shadowSinistra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#55081a" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#bgGradSinistra)"/>
  <rect width="400" height="600" fill="url(#maskGlowSinistra)"/>

  <!-- Ornate Frame -->
  <rect x="16" y="16" width="368" height="568" rx="3" fill="none" stroke="url(#goldSinistra)" stroke-width="1.2" opacity="0.6"/>
  <rect x="22" y="22" width="356" height="556" rx="2" fill="none" stroke="url(#goldSinistra)" stroke-width="0.5" opacity="0.4"/>

  <!-- Top Series Tag -->
  <text x="200" y="55" font-family="'Cinzel', 'Georgia', serif" font-size="10" letter-spacing="4" fill="url(#goldSinistra)" text-anchor="middle">SERIA IMPERIUL UMBRELOR • VOLUMUL 2</text>
  <line x1="110" y1="65" x2="290" y2="65" stroke="url(#goldSinistra)" stroke-width="0.8" opacity="0.5"/>

  <!-- Center Artwork: Masquerade Mask with Ruby Tear & Dagger -->
  <g transform="translate(200, 250)" filter="url(#shadowSinistra)">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#680d21" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldSinistra)" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.4"/>

    <!-- Mask Silhouette -->
    <path d="M -85,-40 C -70,-80 -15,-60 0,-30 C 15,-60 70,-80 85,-40 C 95,10 70,55 0,70 C -70,55 -95,10 -85,-40 Z" 
          fill="#1c0710" stroke="url(#goldSinistra)" stroke-width="2"/>
    <!-- Eye Openings -->
    <path d="M -55,-25 C -40,-45 -25,-25 -25,-15 C -35,-5 -50,-5 -55,-25 Z" fill="#080205" stroke="url(#goldSinistra)" stroke-width="1"/>
    <path d="M 55,-25 C 40,-45 25,-25 25,-15 C 35,-5 50,-5 55,-25 Z" fill="#080205" stroke="url(#goldSinistra)" stroke-width="1"/>

    <!-- Ornate Baroque Filigree & Floral Vines on Mask -->
    <path d="M -75,-25 C -50,15 0,10 0,35 C 0,55 50,20 75,-25" fill="none" stroke="url(#goldSinistra)" stroke-width="1.8"/>
    <path d="M -20,-30 C 0,-60 20,-30 0,10 Z" fill="url(#goldSinistra)" opacity="0.7"/>

    <!-- Blood / Ruby Tear dropping from eye -->
    <path d="M -40,-5 C -38,20 -37,35 -40,48 C -43,35 -42,20 -40,-5 Z" fill="#b31535"/>
    <circle cx="-40" cy="52" r="4" fill="#b31535"/>

    <!-- Dagger Piercing behind Mask -->
    <polygon points="0,-125 5,-50 -5,-50" fill="url(#goldSinistra)"/>
    <polygon points="0,70 6,120 0,140 -6,120" fill="url(#goldSinistra)"/>
    <circle cx="0" cy="-125" r="5" fill="url(#goldSinistra)"/>
  </g>

  <!-- Title Bottom -->
  <text x="200" y="440" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="4" fill="#ffffff" text-anchor="middle">MOȘTENIREA</text>
  <text x="200" y="480" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="30" font-weight="900" letter-spacing="5" fill="url(#goldSinistra)" text-anchor="middle">SINISTRĂ</text>

  <!-- Author Name -->
  <line x1="80" y1="515" x2="320" y2="515" stroke="url(#goldSinistra)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="545" font-family="'Cinzel', 'Georgia', serif" font-size="16" font-weight="700" letter-spacing="8" fill="url(#goldSinistra)" text-anchor="middle">CHRISTIANA CIOCAN</text>
</svg>
