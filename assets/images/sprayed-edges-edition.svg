<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="boxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14060b"/>
      <stop offset="100%" stop-color="#060204"/>
    </linearGradient>

    <linearGradient id="edgeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf1cd"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#fae7b4"/>
      <stop offset="100%" stop-color="#997228"/>
    </linearGradient>

    <radialGradient id="edgeCrimson" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b152d"/>
      <stop offset="100%" stop-color="#420814"/>
    </radialGradient>
  </defs>

  <rect width="500" height="350" fill="url(#boxBg)"/>

  <!-- Ornate Luxury Collector's Box Presentation -->
  <g transform="translate(100, 40)">
    <!-- Box Base -->
    <polygon points="50,220 280,250 340,160 110,130" fill="#1c070f" stroke="url(#edgeGold)" stroke-width="1.5"/>
    <polygon points="50,220 280,250 280,270 50,240" fill="#120409"/>

    <!-- Deluxe Hardcover Book with Stenciled Floral Sprayed Edges -->
    <!-- Pages Block showing sprayed crimson & gold floral edge -->
    <polygon points="70,180 260,205 310,125 120,100" fill="url(#edgeCrimson)" stroke="url(#edgeGold)" stroke-width="1"/>
    
    <!-- Sprayed Edges Floral Pattern Stencil -->
    <path d="M 90,170 C 130,165 170,195 210,180 C 230,170 260,195 280,185" fill="none" stroke="url(#edgeGold)" stroke-width="3" opacity="0.8"/>
    <circle cx="140" cy="175" r="8" fill="none" stroke="url(#edgeGold)" stroke-width="1.5"/>
    <circle cx="210" cy="180" r="10" fill="none" stroke="url(#edgeGold)" stroke-width="1.5"/>

    <!-- Hardcover Top Lid / Book Cover in Gold Foil -->
    <polygon points="60,160 250,185 305,105 115,80" fill="#0c0306" stroke="url(#edgeGold)" stroke-width="2"/>
    <text x="180" y="140" font-family="'Cinzel', serif" font-size="12" letter-spacing="3" fill="url(#edgeGold)" text-anchor="middle" transform="rotate(7, 180, 140)">EDITION DE LUXE</text>
    <text x="180" y="155" font-family="'Cinzel', serif" font-size="9" letter-spacing="2" fill="#fff" text-anchor="middle" transform="rotate(7, 180, 155)">CHRISTIANA CIOCAN</text>

    <!-- Burgundy Velvet Ribbon & Wax Seal -->
    <path d="M 175,70 L 195,280" stroke="#8b152d" stroke-width="14" opacity="0.9"/>
    <circle cx="190" cy="175" r="18" fill="#690e21" stroke="url(#edgeGold)" stroke-width="1.5"/>
    <circle cx="190" cy="175" r="13" fill="#8b152d"/>
    <text x="190" y="180" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="url(#edgeGold)" text-anchor="middle">CC</text>
  </g>

  <!-- Title Badge -->
  <rect x="20" y="290" width="460" height="42" rx="4" fill="rgba(0,0,0,0.7)" stroke="url(#edgeGold)" stroke-width="0.8"/>
  <text x="250" y="316" font-family="'Cinzel', serif" font-size="12" letter-spacing="4" fill="url(#edgeGold)" text-anchor="middle">
    EDIȚIE LIMITATĂ CU MARGINI SPRAYATE &amp; FOIȚĂ DE AUR
  </text>
</svg>
