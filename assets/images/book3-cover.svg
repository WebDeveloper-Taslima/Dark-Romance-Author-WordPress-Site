<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141108"/>
      <stop offset="50%" stop-color="#0a0803"/>
      <stop offset="100%" stop-color="#030201"/>
    </linearGradient>

    <radialGradient id="amberGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#54370a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#241603" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="35%" stop-color="#e5b33d"/>
      <stop offset="70%" stop-color="#c98a18"/>
      <stop offset="100%" stop-color="#fae08c"/>
    </linearGradient>

    <filter id="crownShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#bgGrad3)"/>
  <rect width="400" height="600" fill="url(#amberGlow)"/>

  <!-- Ornate Frame -->
  <rect x="18" y="18" width="364" height="564" rx="4" fill="none" stroke="url(#richGold)" stroke-width="1.2" opacity="0.6"/>
  <rect x="24" y="24" width="352" height="552" rx="2" fill="none" stroke="url(#richGold)" stroke-width="0.6" opacity="0.4"/>

  <!-- Series Badge Top -->
  <text x="200" y="65" font-family="'Cinzel', 'Georgia', serif" font-size="11" letter-spacing="4" fill="url(#richGold)" text-anchor="middle" opacity="0.9">A SINNERS &amp; KINGS NOVEL • BOOK III</text>
  <line x1="120" y1="75" x2="280" y2="75" stroke="url(#richGold)" stroke-width="0.8" opacity="0.5"/>

  <!-- Artwork: Gothic Thorn Crown & Skull / Snake Motif -->
  <g transform="translate(200, 260)" filter="url(#crownShadow)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="#664610" stroke-width="1" opacity="0.3"/>
    
    <!-- Jagged Crown of Thorns -->
    <path d="M -90,-20 
             C -60,-60 -50,-80 -40,-30 
             C -30,-90 -10,-100 0,-40 
             C 10,-100 30,-90 40,-30 
             C 50,-80 60,-60 90,-20 
             C 80,40 50,70 0,75 
             C -50,70 -80,40 -90,-20 Z" 
          fill="#1c1404" stroke="url(#richGold)" stroke-width="2.5"/>

    <!-- Sharp Thorns branching out -->
    <path d="M -70,-30 L -95,-45 L -75,-20" fill="url(#richGold)"/>
    <path d="M -35,-55 L -45,-85 L -25,-50" fill="url(#richGold)"/>
    <path d="M 0,-70 L 0,-115 L 8,-65" fill="url(#richGold)"/>
    <path d="M 35,-55 L 45,-85 L 25,-50" fill="url(#richGold)"/>
    <path d="M 70,-30 L 95,-45 L 75,-20" fill="url(#richGold)"/>

    <path d="M -60,40 L -80,60 L -50,50" fill="url(#richGold)"/>
    <path d="M 60,40 L 80,60 L 50,50" fill="url(#richGold)"/>
    <path d="M 0,75 L 0,105 L 8,75" fill="url(#richGold)"/>

    <!-- Inner Gemstone / Ruby Drop -->
    <polygon points="0,-15 15,10 0,35 -15,10" fill="#99152a" stroke="url(#richGold)" stroke-width="1.2"/>
  </g>

  <!-- Title Section -->
  <text x="200" y="420" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="url(#richGold)" text-anchor="middle">CROWNED IN</text>
  <text x="200" y="465" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="38" font-weight="700" letter-spacing="6" fill="#fdf3d9" text-anchor="middle">THORNS</text>

  <!-- Author Name Bottom -->
  <line x1="80" y1="525" x2="320" y2="525" stroke="url(#richGold)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="555" font-family="'Cinzel', 'Georgia', serif" font-size="18" font-weight="600" letter-spacing="8" fill="url(#richGold)" text-anchor="middle">CHRISTIANA CIOCAN</text>
</svg>
