<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <linearGradient id="authorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b171c"/>
      <stop offset="50%" stop-color="#100d11"/>
      <stop offset="100%" stop-color="#080608"/>
    </linearGradient>

    <radialGradient id="authorHalo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4a1525" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#1f0910" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7126"/>
    </linearGradient>
  </defs>

  <rect width="500" height="650" fill="url(#authorBg)"/>
  <rect width="500" height="650" fill="url(#authorHalo)"/>

  <!-- Ornate Border -->
  <rect x="20" y="20" width="460" height="610" rx="4" fill="none" stroke="url(#goldAcc)" stroke-width="1.5" opacity="0.7"/>
  <rect x="28" y="28" width="444" height="594" rx="2" fill="none" stroke="url(#goldAcc)" stroke-width="0.7" opacity="0.4"/>

  <!-- Aesthetic Silhouette / Portrait -->
  <g transform="translate(250, 310)">
    <!-- Back Hair Flow -->
    <path d="M -70,-80 C -120,-20 -130,80 -80,180 C -30,220 30,220 80,180 C 130,80 120,-20 70,-80 Z" fill="#090709"/>

    <!-- Head & Shoulders Silhouette -->
    <!-- Shoulders / Velvet Gown -->
    <path d="M -160,280 C -120,200 -70,160 0,160 C 70,160 120,200 160,280 Z" fill="#14070c"/>
    <path d="M -160,280 C -100,210 -40,185 0,185 C 40,185 100,210 160,280" fill="none" stroke="url(#goldAcc)" stroke-width="2" opacity="0.6"/>

    <!-- Neck & Jaw -->
    <path d="M -25,90 L -25,145 C -25,155 0,165 0,165 C 0,165 25,155 25,145 L 25,90 Z" fill="#2d2229"/>
    
    <!-- Face Silhouette -->
    <path d="M -45,10 C -45,-70 45,-70 45,10 C 45,65 25,90 0,90 C -25,90 -45,65 -45,10 Z" fill="#3b2d35"/>
    
    <!-- Hair Over Shoulders -->
    <path d="M -50,-60 C -10,-100 40,-90 60,-50 C 75,0 70,50 65,110 C 55,160 40,180 35,210 C 25,170 30,120 40,80 C 50,40 45,-20 20,-45 C -5,-70 -35,-50 -50,-60 Z" fill="#0e0a0e"/>
    <path d="M -60,-50 C -75,0 -70,50 -65,110 C -55,160 -40,180 -35,210 C -25,170 -30,120 -40,80 C -50,40 -45,-20 -20,-45 C -5,-70 -35,-50 -60,-50 Z" fill="#0c080c"/>

    <!-- Gold Choker Necklace with Rose -->
    <path d="M -22,125 C 0,132 0,132 22,125" fill="none" stroke="url(#goldAcc)" stroke-width="3"/>
    <circle cx="0" cy="130" r="4" fill="url(#goldAcc)"/>

    <!-- Gothic Rose in Hair -->
    <g transform="translate(45, -35) scale(0.6)">
      <circle cx="0" cy="0" r="18" fill="#690e21"/>
      <circle cx="0" cy="0" r="12" fill="#99152a"/>
      <circle cx="0" cy="0" r="6" fill="#c91e3b"/>
      <path d="M -10,-15 C 0,-25 15,-20 18,-5" fill="none" stroke="url(#goldAcc)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Name & Title Tag -->
  <text x="250" y="555" font-family="'Cinzel', 'Georgia', serif" font-size="22" font-weight="600" letter-spacing="6" fill="url(#goldAcc)" text-anchor="middle">CHRISTIANA CIOCAN</text>
  <text x="250" y="585" font-family="'Lora', 'Georgia', serif" font-size="12" font-style="italic" letter-spacing="3" fill="#b0a8b2" text-anchor="middle">Author of Morally Grey Sins &amp; Gothic Romance</text>
</svg>
