<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDarul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14080a"/>
      <stop offset="50%" stop-color="#0a0304"/>
      <stop offset="100%" stop-color="#020102"/>
    </linearGradient>

    <radialGradient id="bloodGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#5c0d18" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#24050a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldDarul" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef5dd"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#e8c366"/>
      <stop offset="100%" stop-color="#8a671a"/>
    </linearGradient>

    <filter id="shadowDarul" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="400" height="600" fill="url(#bgGradDarul)"/>
  <rect width="400" height="600" fill="url(#bloodGlow)"/>

  <!-- Ornate Frame -->
  <rect x="16" y="16" width="368" height="568" rx="3" fill="none" stroke="url(#goldDarul)" stroke-width="1.2" opacity="0.6"/>
  <rect x="22" y="22" width="356" height="556" rx="2" fill="none" stroke="url(#goldDarul)" stroke-width="0.5" opacity="0.4"/>

  <!-- Top Series Tag -->
  <text x="200" y="55" font-family="'Cinzel', 'Georgia', serif" font-size="10" letter-spacing="4" fill="url(#goldDarul)" text-anchor="middle">SERIA IMPERIUL UMBRELOR • VOLUMUL 3</text>
  <line x1="110" y1="65" x2="290" y2="65" stroke="url(#goldDarul)" stroke-width="0.8" opacity="0.5"/>

  <!-- Center Artwork: Gothic Plague Doctor / Raven Crow Mask with Candles -->
  <g transform="translate(200, 250)" filter="url(#shadowDarul)">
    <circle cx="0" cy="0" r="115" fill="none" stroke="#5c0d18" stroke-width="1" opacity="0.3"/>
    
    <!-- Crow / Beak Mask Silhouette -->
    <path d="M 0,-70 C 45,-60 70,-30 65,15 C 60,50 30,85 0,140 C -30,85 -60,50 -65,15 C -70,-30 -45,-60 0,-70 Z" 
          fill="#120508" stroke="url(#goldDarul)" stroke-width="2"/>
    <!-- Large Goggle Eyes -->
    <circle cx="-30" cy="-5" r="18" fill="#080204" stroke="url(#goldDarul)" stroke-width="2"/>
    <circle cx="30" cy="-5" r="18" fill="#080204" stroke="url(#goldDarul)" stroke-width="2"/>
    <circle cx="-30" cy="-5" r="10" fill="#690e1f" opacity="0.6"/>
    <circle cx="30" cy="-5" r="10" fill="#690e1f" opacity="0.6"/>

    <!-- Gothic Candlesticks with Flickering Flames behind -->
    <path d="M -80,-30 L -80,40" stroke="url(#goldDarul)" stroke-width="3"/>
    <ellipse cx="-80" cy="-40" rx="4" ry="8" fill="#e5b842"/>
    <path d="M 80,-30 L 80,40" stroke="url(#goldDarul)" stroke-width="3"/>
    <ellipse cx="80" cy="-40" rx="4" ry="8" fill="#e5b842"/>

    <!-- Drips of Blood -->
    <path d="M 0,140 C 2,150 0,160 0,165 C 0,160 -2,150 0,140 Z" fill="#8f1228"/>
  </g>

  <!-- Title Bottom -->
  <text x="200" y="440" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="24" font-weight="700" letter-spacing="4" fill="#ffffff" text-anchor="middle">DARUL</text>
  <text x="200" y="480" font-family="'Cinzel Decorative', 'Cinzel', 'Georgia', serif" font-size="30" font-weight="900" letter-spacing="6" fill="url(#goldDarul)" text-anchor="middle">SÂNGELUI</text>

  <!-- Author Name -->
  <line x1="80" y1="515" x2="320" y2="515" stroke="url(#goldDarul)" stroke-width="1" opacity="0.6"/>
  <text x="200" y="545" font-family="'Cinzel', 'Georgia', serif" font-size="16" font-weight="700" letter-spacing="8" fill="url(#goldDarul)" text-anchor="middle">CHRISTIANA CIOCAN</text>
</svg>
